[project]
name = "pizza-frontend"
version = "0.1.0"
description = "Frontend de estudo (Django + Tailwind) que consome a API pizza_drf na porta 8001."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "django>=6.1.3",
    "httpx>=0.28",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = [
    "ruff>=0.9",
]

[tool.ruff]
line-length = 100
target-version = "py313"
exclude = [".venv", "node_modules", "staticfiles", "*/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "double"
