{% load ui %}
<div class="flex flex-col gap-1">
  {% if field.label %}
    <label for="{{ field.id_for_label }}" class="label">
      {{ field.label }}{% if field.field.required %}<span class="ml-0.5 text-brand-600" aria-hidden="true">*</span>{% endif %}
    </label>
  {% endif %}

  {% if field.field.widget.input_type == "password" %}
    <div class="relative" data-password-wrapper>
      {{ field }}
      <button type="button" data-toggle-password aria-pressed="false" aria-label="Mostrar senha"
              class="absolute right-2 top-1/2 -translate-y-1/2 rounded-md p-2 text-stone-400 hover:text-stone-700 dark:hover:text-stone-200">
        <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M2.036 12.322a1.012 1.012 0 0 1 0-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178Z"/><path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z"/></svg>
      </button>
    </div>
  {% else %}
    {{ field }}
  {% endif %}

  {% if field.help_text %}<p class="text-xs text-stone-500 dark:text-stone-400">{{ field.help_text }}</p>{% endif %}
  {% for error in field.errors %}<p class="text-xs font-medium text-rose-600 dark:text-rose-400">{{ error }}</p>{% endfor %}
</div>
