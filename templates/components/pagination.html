{% if is_paginated %}
  <nav class="mt-8 flex items-center justify-center gap-2" aria-label="Paginação">
    {% if page_obj.has_previous %}
      <a href="{% querystring page=page_obj.previous_page_number %}" class="btn-secondary btn-sm">Anterior</a>
    {% endif %}
    <span class="px-3 text-sm text-stone-500 dark:text-stone-400">
      Página {{ page_obj.number }} de {{ paginator.num_pages }}
    </span>
    {% if page_obj.has_next %}
      <a href="{% querystring page=page_obj.next_page_number %}" class="btn-secondary btn-sm">Próxima</a>
    {% endif %}
  </nav>
{% endif %}
